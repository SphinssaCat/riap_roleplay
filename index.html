    <title>Персонажи — Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #0f3460;
        }

        header h1 {
            color: #e94560;
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .list {
            list-style: none;
            padding: 0;
        }

        .list li {
            margin: 10px 0;
        }

        .list a {
            display: block;
            padding: 18px 24px;
            background: #16213e;
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 10px;
            border-left: 4px solid #0f3460;
            font-size: 1.1em;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .list a:hover {
            background: #0f3460;
            border-left-color: #e94560;
            transform: translateX(6px);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #a8b8d8;
            text-decoration: none;
            font-size: 1em;
            cursor: pointer;
        }

        .back-link:hover {
            color: #e94560;
        }

        .hidden {
            display: none;
        }

        .character-info {
            background: #16213e;
            border-radius: 10px;
            padding: 30px;
            border-left: 4px solid #0f3460;
        }

        .character-info p {
            margin: 10px 0;
            line-height: 1.6;
            font-size: 1.1em;
        }

        .owner-link {
            color: #e94560;
            text-decoration: none;
            cursor: pointer;
        }

        .owner-link:hover {
            text-decoration: underline;
        }

        /* Аватарка участника */
        .participant-avatar {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0f3460;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: block;
            margin: 0 auto 20px auto;
        }

        /* Карточка персонажа */
        .character-card {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: #16213e;
            padding: 20px;
            border-radius: 14px;
            border-left: 4px solid #0f3460;
        }

        .character-card img {
            width: 100px;
            height: 100px;
            min-width: 100px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #e94560;
        }

        .character-info-text {
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <h1 id="page-title">Главная</h1>
</header>

<main>
    <!-- ГЛАВНАЯ СТРАНИЦА (список участников) -->
    <div id="main-view">
        <h2>Участники</h2>
        <ul class="list" id="participants-list"></ul>
    </div>

    <!-- СТРАНИЦА УЧАСТНИКА (список его персонажей) -->
    <div id="participant-view" class="hidden">
        <span class="back-link" onclick="showMain()">← На главную</span>
        <div style="text-align: center; margin-bottom: 30px;">
            <img id="participant-avatar" src="" alt="" class="participant-avatar" style="display: none;">
            <h2 id="participant-name"></h2>
        </div>
        <ul class="list" id="characters-list"></ul>
    </div>

    <!-- СТРАНИЦА ПЕРСОНАЖА -->
    <div id="character-view" class="hidden">
        <span class="back-link" onclick="showParticipant(currentParticipant)">← Назад</span>
        <div class="character-card">
            <img id="character-avatar" src="" alt="" style="display: none;">
            <div class="character-info-text">
                <h2 id="character-name"></h2>
                <div class="character-info" id="character-content"></div>
            </div>
        </div>
    </div>
</main>

√1.3. Раса
「Арахна
Арахны - гуманоидные существа, которые обычно редко отличаются от людей. Никто не знает, откуда они появились: большинство людей считают их просто нечистью. В обычном своём виде они ничем не отличаются от людей, разве что гораздо более бледные и худощавые. Однако, настоящий их облик выглядит жутковато: чисто-белая кожа с мраморными трещинами, идущими вниз от их глаз с чёрными склерами и белыми светящимися зрачками, несколько рядов острых зубов, куда более длинные пальцы с острыми и цепкими когтями. Многие арахны просто привыкают к человеческой форме и не видят в этом смысла. Ещё одна причина - частые попытки людей истребить арахн, в основном - из-за суеверий об их якобы опасности. Это послужило причиной некоторых их особенностей. Во-первых, любая пища арахнам нужна только раз в 3-4 месяца. Изначально это своеобразный механизм выживания, направленный на то, чтобы просто не умереть в трудных условиях, но в итоге это стало одной из основных видовых особенностей. Во-вторых, их инстинкты и предчувствия развиты гораздо сильнее, чем у людей. И в-третьих, арахну очень сложно убить. Единственный вариант - уничтожить их тело полностью (ну или хотя бы большую его часть)」

    // Текущий участник (нужен для возврата со страницы персонажа)
    let currentParticipant = 0;

    // ОТОБРАЖЕНИЕ ГЛАВНОЙ СТРАНИЦЫ
    function showMain() {
        document.getElementById('page-title').textContent = 'Главная';
        document.getElementById('main-view').classList.remove('hidden');
        document.getElementById('participant-view').classList.add('hidden');
        document.getElementById('character-view').classList.add('hidden');
    }

    // ОТОБРАЖЕНИЕ СТРАНИЦЫ УЧАСТНИКА
    function showParticipant(index) {
        // Если вызвано без аргумента (например, при загрузке) — ничего не делаем
        if (index === undefined) return;

        currentParticipant = index;
        const participant = data[index];

        document.getElementById('page-title').textContent = participant.name;
        document.getElementById('participant-name').textContent =
            'Персонажи — ' + participant.name;

        // Аватарка участника
        const avatarEl = document.getElementById('participant-avatar');
        if (participant.avatar) {
            avatarEl.src = 'images/' + participant.avatar;
            avatarEl.style.display = 'block';
        } else {
            avatarEl.style.display = 'none';
        }

        // Список персонажей
        const list = document.getElementById('characters-list');
        list.innerHTML = '';
        participant.characters.forEach(function(char, charIndex) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = char.name;
            a.href = '#';
            a.onclick = function(e) {
                e.preventDefault();
                showCharacter(index, charIndex);
            };
            li.appendChild(a);
            list.appendChild(li);
        });

        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('participant-view').classList.remove('hidden');
        document.getElementById('character-view').classList.add('hidden');
    }

    // ОТОБРАЖЕНИЕ СТРАНИЦЫ ПЕРСОНАЖА
    function showCharacter(partIndex, charIndex) {
        currentParticipant = partIndex;
        const participant = data[partIndex];
        const character = participant.characters[charIndex];

        document.getElementById('page-title').textContent = character.name;
        document.getElementById('character-name').textContent = character.name;

        // Описание персонажа
        const contentEl = document.getElementById('character-content');
        contentEl.innerHTML =
            '<p><strong>Владелец:</strong> <span class="owner-link" onclick="showParticipant(' + partIndex + ')">' +
            participant.name + '</span></p>' +
            '<div style="margin-top: 20px; line-height: 1.6; color: #dcdcdc;">' +
            character.desc +
            '</div>';

        // Аватарка персонажа
        const charAvatarEl = document.getElementById('character-avatar');
        const charAvatarName = 'char-' + character.name.toLowerCase().replace(/\s+/g, '-') + '.png';
        charAvatarEl.src = 'images/' + charAvatarName;
        charAvatarEl.alt = character.name;
        charAvatarEl.style.display = 'block';

        // Если картинка не загрузилась — скрыть её
        charAvatarEl.onerror = function() {
            charAvatarEl.style.display = 'none';
        };

        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('participant-view').classList.add('hidden');
        document.getElementById('character-view').classList.remove('hidden');
    }

    // ЗАПОЛНЕНИЕ ГЛАВНОЙ СТРАНИЦЫ ПРИ ЗАГРУЗКЕ САЙТА
    window.onload = function() {
        const list = document.getElementById('participants-list');
        data.forEach(function(participant, index) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = participant.name;
            a.href = '#';
            a.onclick = function(e) {
                e.preventDefault();
                showParticipant(index);
            };
            li.appendChild(a);
            list.appendChild(li);
        });
    };
