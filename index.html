<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи — Главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #0f3460;
        }

        header h1 {
            color: #e94560;
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .list {
            list-style: none;
            padding: 0;
        }

        .list li {
            margin: 10px 0;
        }

        .list a {
            display: block;
            padding: 18px 24px;
            background: #16213e;
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 10px;
            border-left: 4px solid #0f3460;
            font-size: 1.1em;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .list a:hover {
            background: #0f3460;
            border-left-color: #e94560;
            transform: translateX(6px);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #a8b8d8;
            text-decoration: none;
            font-size: 1em;
            cursor: pointer;
        }

        .back-link:hover {
            color: #e94560;
        }

        .hidden {
            display: none;
        }

        .character-info {
            background: #16213e;
            border-radius: 10px;
            padding: 30px;
            border-left: 4px solid #0f3460;
        }

        .character-info p {
            margin: 10px 0;
            line-height: 1.6;
            font-size: 1.1em;
        }

        .owner-link {
            color: #e94560;
            text-decoration: none;
            cursor: pointer;
        }

        .owner-link:hover {
            text-decoration: underline;
        }

        /* Аватарка участника */
        .participant-avatar {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0f3460;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: block;
            margin: 0 auto 20px auto;
        }

        /* Карточка персонажа */
        .character-card {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: #16213e;
            padding: 20px;
            border-radius: 14px;
            border-left: 4px solid #0f3460;
        }

        .character-card img {
            width: 100px;
            height: 100px;
            min-width: 100px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #e94560;
        }

        .character-info-text {
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <h1 id="page-title">Главная</h1>
</header>

<main>
    <!-- ГЛАВНАЯ СТРАНИЦА (список участников) -->
    <div id="main-view">
        <h2>Участники</h2>
        <ul class="list" id="participants-list"></ul>
    </div>

    <!-- СТРАНИЦА УЧАСТНИКА (список его персонажей) -->
    <div id="participant-view" class="hidden">
        <span class="back-link" onclick="showMain()">← На главную</span>
        <div style="text-align: center; margin-bottom: 30px;">
            <img id="participant-avatar" src="" alt="" class="participant-avatar" style="display: none;">
            <h2 id="participant-name"></h2>
        </div>
        <ul class="list" id="characters-list"></ul>
    </div>

    <!-- СТРАНИЦА ПЕРСОНАЖА -->
    <div id="character-view" class="hidden">
        <span class="back-link" onclick="showParticipant(currentParticipant)">← Назад</span>
        <div class="character-card">
            <img id="character-avatar" src="" alt="" style="display: none;">
            <div class="character-info-text">
                <h2 id="character-name"></h2>
                <div class="character-info" id="character-content"></div>
            </div>
        </div>
    </div>
</main>

<script>
    // ===================================================
    // ДАННЫЕ — весь список участников и их персонажей.
    // Чтобы добавить участника — допишите новый объект в массив.
    // Чтобы добавить персонажа — впишите его в массив characters.
    // avatar — имя файла картинки в папке images/ (пустая строка = нет картинки).
    // desc — описание персонажа (можно использовать HTML-теги: <b>, <br>, <i> и т.д.)
    // ===================================================
    const data = [
        {
            name: "Генри",
            avatar: "",
            characters: [
                { name: "Геката", desc: "Таинственная союзница Генри. Часто скрывает правду, чтобы защитить других — классический ложный антагонист." }
            ]
        },
        {
            name: "Яра",
            avatar: "",
            characters: [
                { name: "Элнир", desc: "Спокойный, рассудительный. Всегда ищет компромисс." },
                { name: "Первый", desc: "Энергичный и прямолинейный. Не любит ждать." }
            ]
        },
        {
            name: "Сфинкс",
            avatar: "",
            characters: [
                { name: "Фео", desc: "Тихий наблюдатель. Знает больше, чем говорит." },
                { name: "Обскури", desc: "Резкий, вспыльчивый. Действует, не думая." },
                { name: "Кира", desc: "Дипломат. Умеет уговорить кого угодно." },
                { name: "Азури", desc: "Мечтательница. Верит в лучшее даже в худшие дни." }
            ]
        },
        {
            name: "Витёк",
            avatar: "",
            characters: [
                { name: "Марк", desc: "Прагматик. Считает, что чувства мешают делу." },
                { name: "Мия", desc: "Оптимистка. Заряжает всех вокруг энергией." },
                { name: "Кейн", desc: "Скептик. Всё проверяет дважды." }
            ]
        },
        {
            name: "Репейник",
            avatar: "",
            characters: [
                { name: "Даала", desc: "Строгая, но справедливая. Держит всех в тонусе." },
                { name: "Кай", desc: "Импульсивный, но преданный. Готов броситься в бой первым." }
            ]
        },
        {
            name: "Марти",
            avatar: "",
            characters: [
                { name: "Сорок Пять", desc: "Загадочный номер вместо имени. О нём почти ничего не известно." }
            ]
        },
        {
            name: "Акарумей Окото",
            avatar: "",
            characters: [
                { name: "Акарумей Окото", desc: "Двойственность имени — часть его образа. Он и участник, и персонаж." }
            ]
        },
        {
            name: "Ясик",
            avatar: "",
            characters: [
                { name: "Яс", desc: "Простой и честный. Не любит усложнять." }
            ]
        },
        {
            name: "Лиза",
            avatar: "",
            characters: [
                { name: "Роберт", desc: "Рассудительный и спокойный. Часто становится голосом разума." }
            ]
        }
    ];

    // Текущий участник (нужен для возврата со страницы персонажа)
    let currentParticipant = 0;

    // ОТОБРАЖЕНИЕ ГЛАВНОЙ СТРАНИЦЫ
    function showMain() {
        document.getElementById('page-title').textContent = 'Главная';
        document.getElementById('main-view').classList.remove('hidden');
        document.getElementById('participant-view').classList.add('hidden');
        document.getElementById('character-view').classList.add('hidden');
    }

    // ОТОБРАЖЕНИЕ СТРАНИЦЫ УЧАСТНИКА
    function showParticipant(index) {
        // Если вызвано без аргумента (например, при загрузке) — ничего не делаем
        if (index === undefined) return;

        currentParticipant = index;
        const participant = data[index];

        document.getElementById('page-title').textContent = participant.name;
        document.getElementById('participant-name').textContent =
            'Персонажи — ' + participant.name;

        // Аватарка участника
        const avatarEl = document.getElementById('participant-avatar');
        if (participant.avatar) {
            avatarEl.src = 'images/' + participant.avatar;
            avatarEl.style.display = 'block';
        } else {
            avatarEl.style.display = 'none';
        }

        // Список персонажей
        const list = document.getElementById('characters-list');
        list.innerHTML = '';
        participant.characters.forEach(function(char, charIndex) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = char.name;
            a.href = '#';
            a.onclick = function(e) {
                e.preventDefault();
                showCharacter(index, charIndex);
            };
            li.appendChild(a);
            list.appendChild(li);
        });

        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('participant-view').classList.remove('hidden');
        document.getElementById('character-view').classList.add('hidden');
    }

    // ОТОБРАЖЕНИЕ СТРАНИЦЫ ПЕРСОНАЖА
    function showCharacter(partIndex, charIndex) {
        currentParticipant = partIndex;
        const participant = data[partIndex];
        const character = participant.characters[charIndex];

        document.getElementById('page-title').textContent = character.name;
        document.getElementById('character-name').textContent = character.name;

        // Описание персонажа
        const contentEl = document.getElementById('character-content');
        contentEl.innerHTML =
            '<p><strong>Владелец:</strong> <span class="owner-link" onclick="showParticipant(' + partIndex + ')">' +
            participant.name + '</span></p>' +
            '<div style="margin-top: 20px; line-height: 1.6; color: #dcdcdc;">' +
            character.desc +
            '</div>';

        // Аватарка персонажа
        const charAvatarEl = document.getElementById('character-avatar');
        const charAvatarName = 'char-' + character.name.toLowerCase().replace(/\s+/g, '-') + '.png';
        charAvatarEl.src = 'images/' + charAvatarName;
        charAvatarEl.alt = character.name;
        charAvatarEl.style.display = 'block';

        // Если картинка не загрузилась — скрыть её
        charAvatarEl.onerror = function() {
            charAvatarEl.style.display = 'none';
        };

        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('participant-view').classList.add('hidden');
        document.getElementById('character-view').classList.remove('hidden');
    }

    // ЗАПОЛНЕНИЕ ГЛАВНОЙ СТРАНИЦЫ ПРИ ЗАГРУЗКЕ САЙТА
    window.onload = function() {
        const list = document.getElementById('participants-list');
        data.forEach(function(participant, index) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = participant.name;
            a.href = '#';
            a.onclick = function(e) {
                e.preventDefault();
                showParticipant(index);
            };
            li.appendChild(a);
            list.appendChild(li);
        });
    };
</script>

</body>
</html>
