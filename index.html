<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Участники и персонажи</title>
    <style>
        :root {
            /* === НАСТРАИВАЕМЫЕ ПЕРЕМЕННЫЕ ОФОРМЛЕНИЯ === */
            --bg-type: gradient;
            --bg-color1: #1a1a2e;
            --bg-color2: #16213e;
            --bg-color3: #0f3460;
            --bg-color4: #533483;
            --bg-solid: #1a1a2e;
            --bg-image: none;
            --bg-image-blend: overlay;
            --font-family: 'Segoe UI', system-ui, sans-serif;
            --font-size-base: 16px;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-bg-hover: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.2);
            --card-radius: 16px;
            --btn-color1: #6a4c93;
            --btn-color2: #9381ff;
            --btn-radius: 12px;
            --btn-color-danger1: #c9184a;
            --btn-color-danger2: #ff4d6d;
            --btn-color-save1: #2d6a4f;
            --btn-color-save2: #52b78a;
            --accent-color: #9381ff;
            --link-color: #9381ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            color: var(--text-color);
            min-height: 100vh;
            background: var(--bg-solid);
        }
        body.bg-gradient {
            background: linear-gradient(-45deg, var(--bg-color1), var(--bg-color2), var(--bg-color3), var(--bg-color4));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        body.bg-image {
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: var(--bg-image-blend);
            background-color: var(--bg-solid);
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #app { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin: 30px 0; font-size: 2em; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: var(--card-radius);
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-align: center;
        }
        .card:hover {
            transform: scale(1.03);
            background: var(--card-bg-hover);
        }
        .card-preview-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .card h3 { margin-bottom: 8px; }
        .card p { font-size: 0.85em; opacity: 0.8; }

        .btn {
            padding: 12px 28px; border: none; border-radius: var(--btn-radius);
            background: linear-gradient(135deg, var(--btn-color1), var(--btn-color2));
            color: #fff; font-size: 16px; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: block; margin: 20px auto;
            font-family: inherit;
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .btn:active { transform: scale(0.98); }
        .btn-danger { background: linear-gradient(135deg, var(--btn-color-danger1), var(--btn-color-danger2)); }
        .btn-save { background: linear-gradient(135deg, var(--btn-color-save1), var(--btn-color-save2)); }
        .btn-small { padding: 6px 14px; font-size: 13px; display: inline-block; margin: 0; }

        .action-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .action-row .btn { margin: 0; width: auto; }

        .form-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .form-box {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 30px; width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
        }
        .form-box h2 { margin-bottom: 20px; }
        .form-box input[type="text"],
        .form-box input[type="url"],
        .form-box textarea {
            width: 100%; padding: 10px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            background: rgba(255,255,255,0.05); color: #fff;
            font-size: 15px; font-family: inherit;
        }
        .form-box input[type="file"] {
            width: 100%; margin-bottom: 12px; font-family: inherit;
        }
        .form-box textarea { min-height: 100px; resize: vertical; }
        .form-box label { display: block; margin-bottom: 5px; opacity: 0.8; font-size: 14px; }
        .form-row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }

        .participant-header { text-align: center; margin-bottom: 30px; }
        .description-block p { margin-bottom: 12px; line-height: 1.6; }
        .description-block p:last-child { margin-bottom: 0; }

        .back-btn { position: fixed; top: 20px; left: 20px; z-index: 50; }
        .loading { text-align: center; padding: 40px; opacity: 0.6; }
        .error-msg { color: #ff4d6d; text-align: center; padding: 20px; }

        .admin-badge {
            position: fixed; top: 20px; right: 20px; z-index: 50;
            background: rgba(147, 129, 255, 0.3);
            border: 1px solid rgba(147, 129, 255, 0.5);
            border-radius: 20px; padding: 6px 16px; font-size: 13px;
        }
        .admin-badge button {
            background: none; border: none; color: #fff; cursor: pointer;
            font-size: 12px; text-decoration: underline; opacity: 0.7;
        }
        .theme-btn {
            position: fixed; top: 20px; left: 20px; z-index: 50;
            background: rgba(147, 129, 255, 0.3);
            border: 1px solid rgba(147, 129, 255, 0.5);
            border-radius: 12px; padding: 8px 14px;
            font-size: 18px; cursor: pointer; color: #fff;
            transition: transform 0.15s, background 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.1);
            background: rgba(147, 129, 255, 0.5);
        }
        .edit-controls { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .empty-state { text-align: center; padding: 40px; opacity: 0.5; }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        .image-gallery img {
            width: 100%; aspect-ratio: 1; object-fit: cover;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer; transition: transform 0.2s;
        }
        .image-gallery img:hover { transform: scale(1.05); }

        .photos-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .photo-edit-item { position: relative; width: 70px; height: 70px; }
        .photo-edit-item img {
            width: 100%; height: 100%; object-fit: cover;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
        }
        .photo-remove-btn {
            position: absolute; top: -6px; right: -6px;
            background: #ff4d6d; border: none; border-radius: 50%;
            width: 20px; height: 20px; color: #fff;
            font-size: 11px; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .photo-hint { font-size: 12px; opacity: 0.6; margin-bottom: 8px; }

        /* === РЕДАКТОР ОФОРМЛЕНИЯ === */
        .theme-editor-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .theme-editor {
            background: #1a1a2e; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; padding: 30px;
            width: 95%; max-width: 650px; max-height: 90vh; overflow-y: auto;
        }
        .theme-editor h2 { margin-bottom: 20px; }
        .theme-section {
            margin-bottom: 24px; padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .theme-section:last-child { border-bottom: none; }
        .theme-section h3 {
            font-size: 15px; margin-bottom: 12px; opacity: 0.9;
        }
        .theme-control { margin-bottom: 12px; }
        .theme-control label {
            display: block; margin-bottom: 4px; font-size: 13px; opacity: 0.7;
        }
        .theme-control input[type="color"] {
            width: 50px; height: 36px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: none; cursor: pointer; vertical-align: middle;
        }
        .theme-control input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
        .theme-control input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
        .theme-control input[type="range"] {
            width: 200px; vertical-align: middle;
        }
        .theme-control select {
            padding: 8px 12px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: rgba(255,255,255,0.05); color: #fff;
            font-size: 14px; font-family: inherit;
        }
        .theme-control .color-row {
            display: flex; align-items: center; gap: 10px;
        }
        .theme-control .color-row span {
            font-size: 12px; opacity: 0.6; font-family: monospace;
        }
        .theme-radio-group {
            display: flex; gap: 10px; margin-bottom: 12px;
        }
        .theme-radio-group label {
            display: flex; align-items: center; gap: 5px; cursor: pointer;
            padding: 8px 14px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; font-size: 13px; opacity: 1;
            transition: background 0.2s;
        }
        .theme-radio-group label:hover { background: rgba(255,255,255,0.05); }
        .theme-radio-group input[type="radio"] { cursor: pointer; }
        .theme-bg-image-preview {
            max-width: 200px; max-height: 120px; border-radius: 8px;
            margin-top: 8px; border: 1px solid rgba(255,255,255,0.2);
        }
        .theme-actions {
            display: flex; gap: 10px; justify-content: center; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="admin-btn-container"></div>
    <div id="theme-btn-container"></div>
    <div id="app"></div>

    <script>
    // ================================================================
    // КОНФИГУРАЦИЯ
    // ================================================================
    const CONFIG = {
        owner: 'SphinssaCat',
        repo: 'riap_roleplay',
        branch: 'main',
        dataFile: 'data.json',
        themeFile: 'theme.json',
        adminPassword: '1550155Кощь'
    };

    // Тема по умолчанию
    const DEFAULT_THEME = {
        bgType: 'gradient',
        bgColor1: '#1a1a2e',
        bgColor2: '#16213e',
        bgColor3: '#0f3460',
        bgColor4: '#533483',
        bgSolid: '#1a1a2e',
        bgImage: '',
        bgImageBlend: 'overlay',
        fontFamily: "'Segoe UI', system-ui, sans-serif",
        fontSizeBase: 16,
        textColor: '#ffffff',
        cardBg: 'rgba(255, 255, 255, 0.1)',
        cardBgHover: 'rgba(255, 255, 255, 0.15)',
        cardBorder: 'rgba(255, 255, 255, 0.2)',
        cardRadius: 16,
        btnColor1: '#6a4c93',
        btnColor2: '#9381ff',
        btnRadius: 12,
        btnDanger1: '#c9184a',
        btnDanger2: '#ff4d6d',
        btnSave1: '#2d6a4f',
        btnSave2: '#52b78a',
        accentColor: '#9381ff',
        linkColor: '#9381ff'
    };

    // УТИЛИТЫ
    function uuid() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }
    function rawUrl(path) {
        return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`;
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function extractPath(url) {
        try {
            const parts = new URL(url).pathname.split('/');
            const idx = parts.indexOf(CONFIG.branch);
            if (idx >= 0) return parts.slice(idx + 1).join('/');
        } catch (e) {}
        return null;
    }
    function formatDescription(text) {
        if (!text) return '<p style="opacity:0.5">Описание не задано.</p>';
        return text
            .split(/\r?\n/)
            .filter(line => line.trim() !== '')
            .map(line => `<p>${escapeHtml(line)}</p>`)
            .join('');
    }
    function getPhotos(item) {
        if (item.photos) return item.photos;
        if (item.photo) return [item.photo];
        return [];
    }
    function renderGallery(photos) {
        if (!photos || photos.length === 0) return '';
        return '<div class="image-gallery">' +
            photos.map(function(url) {
                return '<img src="' + escapeHtml(url) + '" alt="Фото" ' +
                    'onclick="window.open(\'' + escapeHtml(url) + '\',\'_blank\')" ' +
                    'onerror="this.style.display=\'none\'">';
            }).join('') + '</div>';
    }

    // ПРИМЕНЕНИЕ ТЕМЫ
    let currentTheme = null;

    function applyTheme(theme) {
        const r = document.documentElement.style;
        r.setProperty('--bg-type', theme.bgType || 'gradient');
        r.setProperty('--bg-color1', theme.bgColor1 || '#1a1a2e');
        r.setProperty('--bg-color2', theme.bgColor2 || '#16213e');
        r.setProperty('--bg-color3', theme.bgColor3 || '#0f3460');
        r.setProperty('--bg-color4', theme.bgColor4 || '#533483');
        r.setProperty('--bg-solid', theme.bgSolid || '#1a1a2e');
        r.setProperty('--bg-image', theme.bgImage ? `url("${theme.bgImage}")` : 'none');
        r.setProperty('--bg-image-blend', theme.bgImageBlend || 'overlay');
        r.setProperty('--font-family', theme.fontFamily || "'Segoe UI', system-ui, sans-serif");
        r.setProperty('--font-size-base', (theme.fontSizeBase || 16) + 'px');
        r.setProperty('--text-color', theme.textColor || '#ffffff');
        r.setProperty('--card-bg', theme.cardBg || 'rgba(255, 255, 255, 0.1)');
        r.setProperty('--card-bg-hover', theme.cardBgHover || 'rgba(255, 255, 255, 0.15)');
        r.setProperty('--card-border', theme.cardBorder || 'rgba(255, 255, 255, 0.2)');
        r.setProperty('--card-radius', (theme.cardRadius || 16) + 'px');
        r.setProperty('--btn-color1', theme.btnColor1 || '#6a4c93');
        r.setProperty('--btn-color2', theme.btnColor2 || '#9381ff');
        r.setProperty('--btn-radius', (theme.btnRadius || 12) + 'px');
        r.setProperty('--btn-color-danger1', theme.btnDanger1 || '#c9184a');
        r.setProperty('--btn-color-danger2', theme.btnDanger2 || '#ff4d6d');
        r.setProperty('--btn-color-save1', theme.btnSave1 || '#2d6a4f');
        r.setProperty('--btn-color-save2', theme.btnSave2 || '#52b78a');
        r.setProperty('--accent-color', theme.accentColor || '#9381ff');
        r.setProperty('--link-color', theme.linkColor || '#9381ff');

        // Класс body для типа фона
        document.body.classList.remove('bg-gradient', 'bg-image');
        if (theme.bgType === 'gradient') document.body.classList.add('bg-gradient');
        else if (theme.bgType === 'image') document.body.classList.add('bg-image');

        currentTheme = theme;
    }

    // GITHUB API
    const GH = {
        token: localStorage.getItem('gh_token') || '',
        saving: false,

        async getData() {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}?ref=${CONFIG.branch}&t=${Date.now()}`;
            const headers = this.token ? { Authorization: `token ${this.token}` } : {};
            const res = await fetch(url, { headers });
            if (res.status === 404) return { participants: [] };
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Ошибка загрузки данных: ${res.status}`);
            }
            const json = await res.json();
            const content = decodeURIComponent(escape(atob(json.content)));
            const data = JSON.parse(content);
            if (data.participants) {
                for (const p of data.participants) {
                    if (!p.photos && p.photo) p.photos = [p.photo];
                    if (!p.photos) p.photos = [];
                    if (p.characters) {
                        for (const c of p.characters) {
                            if (!c.photos && c.photo) c.photos = [c.photo];
                            if (!c.photos) c.photos = [];
                        }
                    }
                }
            }
            return data;
        },

        async getTheme() {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.themeFile}?ref=${CONFIG.branch}&t=${Date.now()}`;
            const headers = this.token ? { Authorization: `token ${this.token}` } : {};
            const res = await fetch(url, { headers });
            if (res.status === 404) return null;
            if (!res.ok) return null;
            const json = await res.json();
            const content = decodeURIComponent(escape(atob(json.content)));
            return JSON.parse(content);
        },

        async saveTheme(theme) {
            if (!this.token) throw new Error('Не установлен GitHub Token.');
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(theme, null, 2))));
            const curRes = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.themeFile}?ref=${CONFIG.branch}&t=${Date.now()}`,
                { headers: { Authorization: `token ${this.token}` } }
            );
            let sha = null;
            if (curRes.ok) { const cur = await curRes.json(); sha = cur.sha; }
            const body = { message: 'Обновление theme.json', content, branch: CONFIG.branch };
            if (sha) body.sha = sha;
            const res = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.themeFile}`,
                {
                    method: 'PUT',
                    headers: { Authorization: `token ${this.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }
            );
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Ошибка сохранения темы (${res.status})`);
            }
        },

        async saveData(data) {
            if (this.saving) throw new Error('Сохранение уже выполняется');
            this.saving = true;
            if (!this.token) throw new Error('Не установлен GitHub Token. Войдите как админ.');
            const clean = JSON.parse(JSON.stringify(data));
            if (clean.participants) {
                for (const p of clean.participants) {
                    delete p.photo;
                    if (!p.photos) p.photos = [];
                    if (p.characters) {
                        for (const c of p.characters) {
                            delete c.photo;
                            if (!c.photos) c.photos = [];
                        }
                    }
                }
            }
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(clean, null, 2))));
            const curRes = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}?ref=${CONFIG.branch}&t=${Date.now()}`,
                { headers: { Authorization: `token ${this.token}` } }
            );
            let sha = null;
            if (curRes.ok) { const cur = await curRes.json(); sha = cur.sha; }
            const body = { message: 'Обновление data.json', content, branch: CONFIG.branch };
            if (sha) body.sha = sha;
            const res = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFile}`,
                {
                    method: 'PUT',
                    headers: { Authorization: `token ${this.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }
            );
            this.saving = false;
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `Ошибка сохранения (${res.status})`);
            }
        },

        async uploadImage(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['jpg','jpeg','png','gif','webp'].includes(ext)) {
                throw new Error('Неподдерживаемый формат файла');
            }
            if (file.size > 5 * 1024 * 1024) {
                throw new Error('Файл слишком большой (максимум 5 МБ)');
            }
            const filename = `uploads/img-${uuid()}.${ext}`;
            const base64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const parts = reader.result.split(',');
                    if (parts.length !== 2) { reject(new Error('Некорректный формат данных файла')); return; }
                    resolve(parts[1]);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
            const res = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${filename}`,
                {
                    method: 'PUT',
                    headers: { Authorization: `token ${this.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'Загрузка изображения', content: base64, branch: CONFIG.branch })
                }
            );
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error('Не удалось загрузить изображение: ' + (err.message || res.status));
            }
            return rawUrl(filename);
        },

        async deleteFile(path) {
            if (!path) return;
            const res = await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`,
                { headers: { Authorization: `token ${this.token}` } }
            );
            if (!res.ok) return;
            const json = await res.json();
            await fetch(
                `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`,
                {
                    method: 'DELETE',
                    headers: { Authorization: `token ${this.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'Удаление файла', sha: json.sha, branch: CONFIG.branch })
                }
            );
        }
    };

    // STATE
    let state = {
        data: null,
        isAdmin: localStorage.getItem('isAdmin') === 'true',
        loading: true
    };

    // Фоторедактор
    let editingPhotos = [];
    let removedPhotos = [];

    function initPhotoEditor(existingPhotos) {
        editingPhotos = (existingPhotos || []).slice();
        removedPhotos = [];
    }
    function renderPhotoEditor(containerId) {
        const c = document.getElementById(containerId);
        if (!c) return;
        if (editingPhotos.length === 0) {
            c.innerHTML = '<p class="photo-hint">Изображений пока нет</p>';
            return;
        }
        c.innerHTML = editingPhotos.map(function(url, i) {
            return '<div class="photo-edit-item">' +
                '<img src="' + escapeHtml(url) + '" alt="" onerror="this.style.opacity=0.3">' +
                '<button type="button" class="photo-remove-btn" onclick="removePhotoAt(' + i + ')">&#10005;</button>' +
                '</div>';
        }).join('');
    }
    function removePhotoAt(index) {
        const removed = editingPhotos.splice(index, 1)[0];
        if (removed) removedPhotos.push(removed);
        renderPhotoEditor('photos-preview');
    }
    async function addPhotosFromInput(inputId) {
        const input = document.getElementById(inputId);
        if (!input || !input.files.length) return;
        const remaining = 6 - editingPhotos.length;
        if (remaining <= 0) { alert('Максимум 6 изображений'); input.value = ''; return; }
        const files = Array.from(input.files).slice(0, remaining);
        showLoading('Загрузка изображений...');
        for (const file of files) {
            try { const url = await GH.uploadImage(file); editingPhotos.push(url); }
            catch (e) { alert('Ошибка: ' + e.message); }
        }
        closeLoading(); input.value = ''; renderPhotoEditor('photos-preview');
    }
    async function cleanupRemovedPhotos() {
        for (const url of removedPhotos) {
            try { await GH.deleteFile(extractPath(url)); } catch (e) {}
        }
        removedPhotos = [];
    }

    // КНОПКИ АДМИНА
    function renderAdminBtn() {
        const container = document.getElementById('admin-btn-container');
        if (state.isAdmin) {
            container.innerHTML = '<div class="admin-badge">&#128081; Админ <button onclick="logout()">Выйти</button></div>';
        } else {
            container.innerHTML = '<div class="admin-badge"><button onclick="loginAdmin()">Войти</button></div>';
        }
        renderThemeBtn();
    }
    function renderThemeBtn() {
        const container = document.getElementById('theme-btn-container');
        if (state.isAdmin) {
            container.innerHTML = '<button class="theme-btn" onclick="openThemeEditor()" title="Редактировать оформление">\uD83D\uDCDD</button>';
        } else {
            container.innerHTML = '';
        }
    }

    // АДМИН: ВХОД / ВЫХОД
    async function loginAdmin() {
        const password = prompt('Введите пароль для редактирования:');
        if (password === null) return false;
        if (password !== CONFIG.adminPassword) { alert('Неверный пароль'); return false; }
        let token = localStorage.getItem('gh_token');
        if (!token) {
            token = prompt('Введите ваш GitHub Personal Access Token\n(нужны права repo):');
            if (!token || !token.trim()) return false;
            localStorage.setItem('gh_token', token.trim());
        }
        GH.token = token.trim();
        state.isAdmin = true;
        localStorage.setItem('isAdmin', 'true');
        renderAdminBtn();
        route();
        return true;
    }
    function logout() {
        state.isAdmin = false;
        localStorage.removeItem('isAdmin');
        localStorage.removeItem('gh_token');
        GH.token = '';
        renderAdminBtn();
        route();
    }
    async function checkAdminAccess() {
        if (state.isAdmin) return true;
        return await loginAdmin();
    }

    // РУЧНОЕ СОХРАНЕНИЕ
    async function manualSave() {
        if (!(await checkAdminAccess())) return;
        if (!state.data) { alert('Нет данных для сохранения'); return; }
        if (GH.saving) { alert('Сохранение уже выполняется, подождите...'); return; }
        showLoading('Сохранение на GitHub...');
        try { await GH.saveData(state.data); closeLoading(); alert('Изменения сохранены!'); }
        catch (e) { closeLoading(); alert('Ошибка сохранения: ' + e.message); }
    }

    // ================================================================
    // РЕДАКТОР ОФОРМЛЕНИЯ
    // ================================================================
    let themeEditorState = null;

    function openThemeEditor() {
        themeEditorState = Object.assign({}, currentTheme || DEFAULT_THEME);
        renderThemeEditor();
    }

    function renderThemeEditor() {
        const t = themeEditorState;
        const old = document.getElementById('theme-editor-overlay');
        if (old) old.remove();

        const overlay = document.createElement('div');
        overlay.className = 'theme-editor-overlay';
        overlay.id = 'theme-editor-overlay';

        let html = '<div class="theme-editor">';
        html += '<h2>\uD83D\uDCDD Редактор оформления</h2>';

        // --- ФОН ---
        html += '<div class="theme-section"><h3>Фон</h3>';
        html += '<div class="theme-radio-group">';
        html += '<label><input type="radio" name="bg-type" value="gradient" ' + (t.bgType === 'gradient' ? 'checked' : '') + ' onchange="themeBgTypeChanged(\'gradient\')"> Градиент</label>';
        html += '<label><input type="radio" name="bg-type" value="solid" ' + (t.bgType === 'solid' ? 'checked' : '') + ' onchange="themeBgTypeChanged(\'solid\')"> Однотонный</label>';

        html += '</div>';

        // Градиент
        if (t.bgType === 'gradient') {
            html += '<div class="theme-control"><label>Цвет 1</label><div class="color-row">';
            html += '<input type="color" value="' + t.bgColor1 + '" onchange="themeUpdate(\'bgColor1\', this.value)">';
            html += '<span>' + t.bgColor1 + '</span></div></div>';
            html += '<div class="theme-control"><label>Цвет 2</label><div class="color-row">';
            html += '<input type="color" value="' + t.bgColor2 + '" onchange="themeUpdate(\'bgColor2\', this.value)">';
            html += '<span>' + t.bgColor2 + '</span></div></div>';
            html += '<div class="theme-control"><label>Цвет 3</label><div class="color-row">';
            html += '<input type="color" value="' + t.bgColor3 + '" onchange="themeUpdate(\'bgColor3\', this.value)">';
            html += '<span>' + t.bgColor3 + '</span></div></div>';
            html += '<div class="theme-control"><label>Цвет 4</label><div class="color-row">';
            html += '<input type="color" value="' + t.bgColor4 + '" onchange="themeUpdate(\'bgColor4\', this.value)">';
            html += '<span>' + t.bgColor4 + '</span></div></div>';
        }

        // Однотонный
        if (t.bgType === 'solid') {
            html += '<div class="theme-control"><label>Цвет фона</label><div class="color-row">';
            html += '<input type="color" value="' + t.bgSolid + '" onchange="themeUpdate(\'bgSolid\', this.value)">';
            html += '<span>' + t.bgSolid + '</span></div></div>';
        }

        // Картинка
        if (t.bgType === 'image') {
            html += '<div class="theme-control"><label>URL картинки фона</label>';
            html += '<input type="text" value="' + escapeHtml(t.bgImage || '') + '" placeholder="https://..." onchange="themeUpdate(\'bgImage\', this.value)">';
            html += '<input type="file" accept="image/*" onchange="themeUploadBg(this)">';
            html += '<label>Цвет подложки (виден при полупрозрачной картинке)</label><div class="color-row">';
            html += '<input type="color" value="' + t.bgSolid + '" onchange="themeUpdate(\'bgSolid\', this.value)">';
            html += '<span>' + t.bgSolid + '</span></div></div>';
            html += '<div class="theme-control"><label>Режим наложения</label>';
            html += '<select onchange="themeUpdate(\'bgImageBlend\', this.value)">';
            ['overlay','normal','multiply','screen','darken','lighten','color-dodge','soft-light','hard-light','difference','exclusion'].forEach(m => {
                html += '<option value="' + m + '" ' + (t.bgImageBlend === m ? 'selected' : '') + '>' + m + '</option>';
            });
            html += '</select></div>';
            if (t.bgImage) {
                html += '<img class="theme-bg-image-preview" src="' + escapeHtml(t.bgImage) + '" onerror="this.style.display=\'none\'">';
            }
        }
        html += '</div>';

        // --- ШРИФТ ---
        html += '<div class="theme-section"><h3>Шрифт</h3>';
        html += '<div class="theme-control"><label>Семейство шрифта</label>';
        html += '<select onchange="themeUpdate(\'fontFamily\', this.value)">';
        const fonts = [
            ["'Segoe UI', system-ui, sans-serif", "Segoe UI (по умолчанию)"],
            ["'Arial', sans-serif", "Arial"],
            ["'Helvetica Neue', Helvetica, sans-serif", "Helvetica"],
            ["'Georgia', serif", "Georgia (с засечками)"],
            ["'Times New Roman', Times, serif", "Times New Roman"],
            ["'Courier New', Courier, monospace", "Courier New (моноширинный)"],
            ["'Trebuchet MS', sans-serif", "Trebuchet MS"],
            ["'Verdana', sans-serif", "Verdana"],
            ["'Tahoma', sans-serif", "Tahoma"],
            ["'Roboto', sans-serif", "Roboto"],
            ["'Montserrat', sans-serif", "Montserrat"],
            ["'Comic Sans MS', cursive", "Comic Sans"],
            ["'Impact', sans-serif", "Impact"]
        ];
        fonts.forEach(f => {
            html += '<option value="' + f[0] + '" ' + (t.fontFamily === f[0] ? 'selected' : '') + '>' + f[1] + '</option>';
        });
        html += '</select></div>';
        html += '<div class="theme-control"><label>Размер шрифта: ' + t.fontSizeBase + 'px</label>';
        html += '<input type="range" min="12" max="24" step="1" value="' + t.fontSizeBase + '" onchange="themeUpdate(\'fontSizeBase\', parseInt(this.value)); document.querySelector(\'#theme-editor-overlay label\').textContent = \'Размер шрифта: \' + this.value + \'px\'"></div>';
        html += '<div class="theme-control"><label>Цвет текста</label><div class="color-row">';
        html += '<input type="color" value="' + t.textColor + '" onchange="themeUpdate(\'textColor\', this.value)">';
        html += '<span>' + t.textColor + '</span></div></div>';
        html += '</div>';

        // --- КАРТОЧКИ ---
        html += '<div class="theme-section"><h3>Карточки</h3>';
        html += '<div class="theme-control"><label>Прозрачность фона карточек: ' + (parseFloat(t.cardBg.match(/[\d.]+/)[0]) * 100).toFixed(0) + '%</label>';
        const cardOpacity = parseFloat(t.cardBg.match(/[\d.]+/)[0]);
        html += '<input type="range" min="0" max="1" step="0.05" value="' + cardOpacity + '" onchange="themeCardOpacityChanged(parseFloat(this.value))"></div>';
        html += '<div class="theme-control"><label>Скругление углов: ' + t.cardRadius + 'px</label>';
        html += '<input type="range" min="0" max="30" step="1" value="' + t.cardRadius + '" onchange="themeUpdate(\'cardRadius\', parseInt(this.value))"></div>';
        html += '<div class="theme-control"><label>Цвет рамки</label><div class="color-row">';
        // Извлекаем цвет из rgba
        const borderMatch = t.cardBorder.match(/rgba?$([^)]+)$/);
        const borderRgb = borderMatch ? borderMatch[1].split(',').map(s => parseInt(s.trim())) : [255,255,255];
        const borderHex = '#' + borderRgb.slice(0,3).map(v => v.toString(16).padStart(2,'0')).join('');
        const borderAlpha = borderRgb[3] !== undefined ? borderRgb[3] : 1;
        html += '<input type="color" value="' + borderHex + '" onchange="themeBorderColorChanged(this.value, ' + borderAlpha + ')">';
        html += '<span>' + t.cardBorder + '</span></div></div>';
        html += '</div>';

        // --- КНОПКИ ---
        html += '<div class="theme-section"><h3>Кнопки</h3>';
        html += '<div class="theme-control"><label>Основной цвет 1</label><div class="color-row">';
        html += '<input type="color" value="' + t.btnColor1 + '" onchange="themeUpdate(\'btnColor1\', this.value)">';
        html += '<span>' + t.btnColor1 + '</span></div></div>';
        html += '<div class="theme-control"><label>Основной цвет 2</label><div class="color-row">';
        html += '<input type="color" value="' + t.btnColor2 + '" onchange="themeUpdate(\'btnColor2\', this.value)">';
        html += '<span>' + t.btnColor2 + '</span></div></div>';
        html += '<div class="theme-control"><label>Скругление углов кнопок: ' + t.btnRadius + 'px</label>';
        html += '<input type="range" min="0" max="30" step="1" value="' + t.btnRadius + '" onchange="themeUpdate(\'btnRadius\', parseInt(this.value))"></div>';
        html += '<div class="theme-control"><label>Цвет кнопки удаления 1</label><div class="color-row">';
        html += '<input type="color" value="' + t.btnDanger1 + '" onchange="themeUpdate(\'btnDanger1\', this.value)">';
        html += '<span>' + t.btnDanger1 + '</span></div></div>';
        html += '<div class="theme-control"><label>Цвет кнопки удаления 2</label><div class="color-row">';
        html += '<input type="color" value="' + t.btnDanger2 + '" onchange="themeUpdate(\'btnDanger2\', this.value)">';
        html += '<span>' + t.btnDanger2 + '</span></div></div>';
        html += '<div class="theme-control"><label>Цвет кнопки сохранения 1</label><div class="color-row">';
        html += '<input type="color" value="' + t.btnSave1 + '" onchange="themeUpdate(\'btnSave1\', this.value)">';
        html += '<span>' + t.btnSave1 + '</span></div></div>';
        html += '<div class="theme-control"><label>Цвет кнопки сохранения 2</label><div class="color-row">';
        html += '<input type="color" value="' + t.btnSave2 + '" onchange="themeUpdate(\'btnSave2\', this.value)">';
        html += '<span>' + t.btnSave2 + '</span></div></div>';
        html += '</div>';

        // --- АКЦЕНТ ---
        html += '<div class="theme-section"><h3>Акцент</h3>';
        html += '<div class="theme-control"><label>Акцентный цвет</label><div class="color-row">';
        html += '<input type="color" value="' + t.accentColor + '" onchange="themeUpdate(\'accentColor\', this.value); themeUpdate(\'linkColor\', this.value)">';
        html += '<span>' + t.accentColor + '</span></div></div>';
        html += '</div>';

        // --- КНОПКИ ДЕЙСТВИЙ ---
        html += '<div class="theme-actions">';
        html += '<button class="btn btn-small" onclick="themeSave()">\uD83D\uDCBE Сохранить</button>';
        html += '<button class="btn btn-small btn-danger" onclick="themeReset()">\u21BA Сбросить</button>';
        html += '<button class="btn btn-small btn-danger" onclick="closeThemeEditor()">Закрыть</button>';
        html += '</div>';
        html += '</div>';

        overlay.innerHTML = html;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target === overlay) closeThemeEditor(); });

        // Применяем для живого превью
        applyTheme(themeEditorState);
    }

    function closeThemeEditor() {
        const o = document.getElementById('theme-editor-overlay');
        if (o) o.remove();
        // Возвращаем сохранённую тему
        if (currentTheme) applyTheme(currentTheme);
    }

    function themeUpdate(key, value) {
        themeEditorState[key] = value;
        applyTheme(themeEditorState);
    }

    function themeBgTypeChanged(type) {
        themeEditorState.bgType = type;
        renderThemeEditor();
        applyTheme(themeEditorState);
    }

    function themeCardOpacityChanged(opacity) {
        themeEditorState.cardBg = 'rgba(255, 255, 255, ' + opacity + ')';
        themeEditorState.cardBgHover = 'rgba(255, 255, 255, ' + (opacity + 0.05) + ')';
        applyTheme(themeEditorState);
        // Обновляем подпись слайдера
        const labels = document.querySelectorAll('#theme-editor-overlay .theme-control label');
        if (labels[0]) labels[0].textContent = 'Прозрачность фона карточек: ' + (opacity * 100).toFixed(0) + '%';
    }

    function themeBorderColorChanged(hex, alpha) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        themeEditorState.cardBorder = 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
        applyTheme(themeEditorState);
    }

    async function themeUploadBg(input) {
        if (!input.files[0]) return;
        showLoading('Загрузка фона...');
        try {
            const url = await GH.uploadImage(input.files[0]);
            themeEditorState.bgImage = url;
            closeLoading();
            renderThemeEditor();
            applyTheme(themeEditorState);
        } catch (e) {
            closeLoading();
            alert('Ошибка: ' + e.message);
        }
    }

    async function themeSave() {
        showLoading('Сохранение оформления...');
        try {
            await GH.saveTheme(themeEditorState);
            currentTheme = Object.assign({}, themeEditorState);
            closeLoading();
            alert('Оформление сохранено!');
            closeThemeEditor();
        } catch (e) {
            closeLoading();
            alert('Ошибка: ' + e.message);
        }
    }

    function themeReset() {
        if (!confirm('Сбросить оформление к стандартному?')) return;
        themeEditorState = Object.assign({}, DEFAULT_THEME);
        renderThemeEditor();
        applyTheme(themeEditorState);
    }

    // ROUTER
    function route() {
        const hash = location.hash.slice(1) || '/';
        const parts = hash.split('/').filter(Boolean);
        if (parts.length === 0) {
            renderMain();
        } else if (parts[0] === 'participant' && parts[1]) {
            if (parts[2] === 'character' && parts[3]) {
                renderCharacter(parts[1], parts[3]);
            } else {
                renderParticipant(parts[1]);
            }
        } else {
            renderMain();
        }
    }

    // РЕНДЕР: ГЛАВНАЯ
    async function renderMain() {
        const app = document.getElementById('app');
        try {
            if (!state.data) state.data = await GH.getData();
        } catch (e) { app.innerHTML = '<div class="error-msg">Ошибка: ' + escapeHtml(e.message) + '</div>'; return; }

        const participants = state.data.participants || [];
        let html = '<h1>Участники</h1>';

        if (participants.length === 0) {
            html += '<div class="empty-state">Пока нет ни одного участника</div>';
        } else {
            html += '<div class="cards-grid">';
            for (const p of participants) {
                const photos = getPhotos(p);
                const preview = photos.length > 0
                    ? '<img class="card-preview-img" src="' + escapeHtml(photos[0]) + '" alt="' + escapeHtml(p.name) + '" onerror="this.style.display=\'none\'">'
                    : '';
                const desc = (p.description || '').slice(0, 80);
                html += '<div class="card" onclick="location.hash = \'/participant/' + p.id + '\'">' +
                    preview +
                    '<h3>' + escapeHtml(p.name) + '</h3>' +
                    '<p>' + escapeHtml(desc) + (p.description && p.description.length > 80 ? '\u2026' : '') + '</p>' +
                    (state.isAdmin ? '<div class="edit-controls" onclick="event.stopPropagation()">' +
                        '<button class="btn btn-small" onclick="editParticipant(\'' + p.id + '\')">&#9998; Изменить</button>' +
                        '<button class="btn btn-small btn-danger" onclick="deleteParticipant(\'' + p.id + '\')">&#128465; Удалить</button>' +
                    '</div>' : '') +
                '</div>';
            }
            html += '</div>';
        }
        html += '<div class="action-row">';
        html += '<button class="btn" onclick="addParticipant()">+ Добавить участника</button>';
        if (state.isAdmin) html += '<button class="btn btn-save" onclick="manualSave()">\uD83D\uDCBE Сохранить</button>';
        html += '</div>';
        app.innerHTML = html;
    }

    // РЕНДЕР: СТРАНИЦА УЧАСТНИКА
    async function renderParticipant(id) {
        const app = document.getElementById('app');
        if (!state.data) { try { state.data = await GH.getData(); } catch (e) { app.innerHTML = '<div class="error-msg">' + escapeHtml(e.message) + '</div>'; return; } }
        const participant = (state.data.participants || []).find(p => p.id === id);
        if (!participant) { app.innerHTML = '<div class="error-msg">Участник не найден</div><button class="btn" onclick="location.hash=\'/\'">На главную</button>'; return; }

        const photos = getPhotos(participant);
        let html = '<button class="btn btn-small back-btn" onclick="location.hash=\'/\'">\u2190 Назад</button>';
        html += '<div class="participant-header">' +
            renderGallery(photos) +
            '<h2>' + escapeHtml(participant.name) + '</h2>' +
            '<div class="description-block">' + formatDescription(participant.description) + '</div>' +
            (state.isAdmin ? '<div class="edit-controls">' +
                '<button class="btn btn-small" onclick="editParticipant(\'' + participant.id + '\')">&#9998; Изменить</button>' +
                '<button class="btn btn-small btn-danger" onclick="deleteParticipant(\'' + participant.id + '\')">&#128465; Удалить</button>' +
            '</div>' : '') +
        '</div>';

        const characters = participant.characters || [];
        if (characters.length === 0) {
            html += '<div class="empty-state">У этого участника пока нет персонажей</div>';
        } else {
            html += '<div class="cards-grid">';
            for (const c of characters) {
                const cPhotos = getPhotos(c);
                const cPreview = cPhotos.length > 0
                    ? '<img class="card-preview-img" src="' + escapeHtml(cPhotos[0]) + '" alt="' + escapeHtml(c.name) + '" onerror="this.style.display=\'none\'">'
                    : '';
                const cDesc = (c.description || '').slice(0, 80);
                html += '<div class="card" onclick="location.hash = \'/participant/' + participant.id + '/character/' + c.id + '\'">' +
                    cPreview +
                    '<h3>' + escapeHtml(c.name) + '</h3>' +
                    '<p>' + escapeHtml(cDesc) + (c.description && c.description.length > 80 ? '\u2026' : '') + '</p>' +
                    (state.isAdmin ? '<div class="edit-controls" onclick="event.stopPropagation()">' +
                        '<button class="btn btn-small" onclick="editCharacter(\'' + participant.id + '\',\'' + c.id + '\')">&#9998; Изменить</button>' +
                        '<button class="btn btn-small btn-danger" onclick="deleteCharacter(\'' + participant.id + '\',\'' + c.id + '\')">&#128465; Удалить</button>' +
                    '</div>' : '') +
                '</div>';
            }
            html += '</div>';
        }
        html += '<div class="action-row">';
        html += '<button class="btn" onclick="addCharacter(\'' + participant.id + '\')">+ Добавить персонажа</button>';
        if (state.isAdmin) html += '<button class="btn btn-save" onclick="manualSave()">\uD83D\uDCBE Сохранить</button>';
        html += '</div>';
        app.innerHTML = html;
    }

    // РЕНДЕР: СТРАНИЦА ПЕРСОНАЖА
    async function renderCharacter(pid, cid) {
        const app = document.getElementById('app');
        if (!state.data) { try { state.data = await GH.getData(); } catch (e) { app.innerHTML = '<div class="error-msg">' + escapeHtml(e.message) + '</div>'; return; } }
        const p = (state.data.participants || []).find(x => x.id === pid);
        if (!p) { app.innerHTML = '<div class="error-msg">Участник не найден</div>'; return; }
        const c = (p.characters || []).find(x => x.id === cid);
        if (!c) { app.innerHTML = '<div class="error-msg">Персонаж не найден</div>'; return; }

        const photos = getPhotos(c);
        let html = '<button class="btn btn-small back-btn" onclick="location.hash=\'/participant/' + pid + '\'">\u2190 Назад</button>';
        html += '<div class="participant-header">' +
            renderGallery(photos) +
            '<h2>' + escapeHtml(c.name) + '</h2>' +
            '<div class="description-block">' + formatDescription(c.description) + '</div>' +
            '<p style="margin-top:10px;opacity:0.5;font-size:14px">Участник: ' + escapeHtml(p.name) + '</p>' +
            (state.isAdmin ? '<div class="edit-controls">' +
                '<button class="btn btn-small" onclick="editCharacter(\'' + pid + '\',\'' + cid + '\')">&#9998; Изменить</button>' +
                '<button class="btn btn-small btn-danger" onclick="deleteCharacter(\'' + pid + '\',\'' + cid + '\')">&#128465; Удалить</button>' +
            '</div>' : '') +
        '</div>';
        app.innerHTML = html;
    }

    // ФОРМЫ
    function showForm(html) {
        const old = document.getElementById('form-overlay'); if (old) old.remove();
        const o = document.createElement('div'); o.className = 'form-overlay'; o.id = 'form-overlay';
        o.innerHTML = '<div class="form-box">' + html + '</div>';
        document.body.appendChild(o);
        o.addEventListener('click', e => { if (e.target === o) o.remove(); });
    }
    function closeForm() { const o = document.getElementById('form-overlay'); if (o) o.remove(); }
    function showLoading(text) {
        const old = document.getElementById('loading-overlay'); if (old) old.remove();
        const d = document.createElement('div'); d.className = 'form-overlay'; d.id = 'loading-overlay';
        d.innerHTML = '<div class="form-box"><p style="text-align:center">' + (text || 'Загрузка...') + '</p></div>';
        document.body.appendChild(d);
    }
    function closeLoading() { const o = document.getElementById('loading-overlay'); if (o) o.remove(); }

    // УЧАСТНИКИ
    async function addParticipant() {
        if (!(await checkAdminAccess())) return;
        initPhotoEditor([]);
        showForm('<h2>Новый участник</h2>' +
            '<label>Имя *</label><input type="text" id="p-name" placeholder="Имя участника">' +
            '<label>Описание</label><textarea id="p-desc" placeholder="Краткое описание"></textarea>' +
            '<label>Изображения (до 6 шт.)</label>' +
            '<input type="file" id="p-photos" accept="image/*" multiple onchange="addPhotosFromInput(\'p-photos\')">' +
            '<div class="photos-preview" id="photos-preview"></div>' +
            '<div class="form-row"><button class="btn" onclick="saveNewParticipant()">Сохранить</button>' +
            '<button class="btn btn-danger" onclick="closeForm()">Отмена</button></div>');
        renderPhotoEditor('photos-preview');
    }
    async function saveNewParticipant() {
        const name = document.getElementById('p-name').value.trim();
        if (!name) { alert('Введите имя'); return; }
        const desc = document.getElementById('p-desc').value.trim();
        closeForm(); showLoading('Сохранение...');
        if (!state.data.participants) state.data.participants = [];
        state.data.participants.push({ id: uuid(), name, description: desc, photos: editingPhotos.slice(), characters: [] });
        try { await GH.saveData(state.data); } catch (e) { closeLoading(); alert('Ошибка: ' + e.message); return; }
        closeLoading(); renderMain();
    }
    async function editParticipant(id) {
        if (!(await checkAdminAccess())) return;
        const p = state.data.participants.find(x => x.id === id); if (!p) return;
        initPhotoEditor(getPhotos(p));
        showForm('<h2>Редактировать участника</h2>' +
            '<label>Имя *</label><input type="text" id="p-name" value="' + escapeHtml(p.name) + '">' +
            '<label>Описание</label><textarea id="p-desc">' + escapeHtml(p.description || '') + '</textarea>' +
            '<label>Изображения (до 6 шт.)</label>' +
            '<input type="file" id="p-photos" accept="image/*" multiple onchange="addPhotosFromInput(\'p-photos\')">' +
            '<div class="photos-preview" id="photos-preview"></div>' +
            '<div class="form-row"><button class="btn" onclick="saveEditParticipant(\'' + id + '\')">Сохранить</button>' +
            '<button class="btn btn-danger" onclick="closeForm()">Отмена</button></div>');
        renderPhotoEditor('photos-preview');
    }
    async function saveEditParticipant(id) {
        const name = document.getElementById('p-name').value.trim();
        if (!name) { alert('Введите имя'); return; }
        const desc = document.getElementById('p-desc').value.trim();
        closeForm(); showLoading('Сохранение...');
        const p = state.data.participants.find(x => x.id === id); if (!p) { closeLoading(); return; }
        p.name = name; p.description = desc; p.photos = editingPhotos.slice();
        await cleanupRemovedPhotos();
        try { await GH.saveData(state.data); } catch (e) { closeLoading(); alert('Ошибка: ' + e.message); return; }
        closeLoading(); route();
    }
    async function deleteParticipant(id) {
        if (!(await checkAdminAccess())) return;
        if (!confirm('Удалить участника и всех его персонажей?')) return;
        showLoading('Удаление...');
        const p = state.data.participants.find(x => x.id === id);
        if (p) {
            const photos = getPhotos(p);
            for (const url of photos) { try { await GH.deleteFile(extractPath(url)); } catch(e) {} }
            if (p.characters) for (const c of p.characters) {
                const cPhotos = getPhotos(c);
                for (const url of cPhotos) { try { await GH.deleteFile(extractPath(url)); } catch(e) {} }
            }
        }
        state.data.participants = state.data.participants.filter(x => x.id !== id);
        try { await GH.saveData(state.data); } catch (e) { closeLoading(); alert('Ошибка: ' + e.message); return; }
        closeLoading(); location.hash = '/'; renderMain();
    }

    // ПЕРСОНАЖИ
    async function addCharacter(pid) {
        if (!(await checkAdminAccess())) return;
        initPhotoEditor([]);
        showForm('<h2>Новый персонаж</h2>' +
            '<label>Имя *</label><input type="text" id="c-name" placeholder="Имя персонажа">' +
            '<label>Описание</label><textarea id="c-desc" placeholder="Краткое описание"></textarea>' +
            '<label>Изображения (до 6 шт.)</label>' +
            '<input type="file" id="c-photos" accept="image/*" multiple onchange="addPhotosFromInput(\'c-photos\')">' +
            '<div class="photos-preview" id="photos-preview"></div>' +
            '<div class="form-row"><button class="btn" onclick="saveNewCharacter(\'' + pid + '\')">Сохранить</button>' +
            '<button class="btn btn-danger" onclick="closeForm()">Отмена</button></div>');
        renderPhotoEditor('photos-preview');
    }
    async function saveNewCharacter(pid) {
        const name = document.getElementById('c-name').value.trim();
        if (!name) { alert('Введите имя'); return; }
        const desc = document.getElementById('c-desc').value.trim();
        closeForm(); showLoading('Сохранение...');
        const p = state.data.participants.find(x => x.id === pid);
        if (!p.characters) p.characters = [];
        p.characters.push({ id: uuid(), name, description: desc, photos: editingPhotos.slice() });
        try { await GH.saveData(state.data); } catch (e) { closeLoading(); alert('Ошибка: ' + e.message); return; }
        closeLoading(); renderParticipant(pid);
    }
    async function editCharacter(pid, cid) {
        if (!(await checkAdminAccess())) return;
        const p = state.data.participants.find(x => x.id === pid); if (!p) return;
        const c = (p.characters || []).find(x => x.id === cid); if (!c) return;
        initPhotoEditor(getPhotos(c));
        showForm('<h2>Редактировать персонажа</h2>' +
            '<label>Имя *</label><input type="text" id="c-name" value="' + escapeHtml(c.name) + '">' +
            '<label>Описание</label><textarea id="c-desc">' + escapeHtml(c.description || '') + '</textarea>' +
            '<label>Изображения (до 6 шт.)</label>' +
            '<input type="file" id="c-photos" accept="image/*" multiple onchange="addPhotosFromInput(\'c-photos\')">' +
            '<div class="photos-preview" id="photos-preview"></div>' +
            '<div class="form-row"><button class="btn" onclick="saveEditCharacter(\'' + pid + '\',\'' + cid + '\')">Сохранить</button>' +
            '<button class="btn btn-danger" onclick="closeForm()">Отмена</button></div>');
        renderPhotoEditor('photos-preview');
    }
    async function saveEditCharacter(pid, cid) {
        const name = document.getElementById('c-name').value.trim();
        if (!name) { alert('Введите имя'); return; }
        const desc = document.getElementById('c-desc').value.trim();
        closeForm(); showLoading('Сохранение...');
        const p = state.data.participants.find(x => x.id === pid); if (!p) { closeLoading(); return; }
        const c = (p.characters || []).find(x => x.id === cid); if (!c) { closeLoading(); return; }
        c.name = name; c.description = desc; c.photos = editingPhotos.slice();
        await cleanupRemovedPhotos();
        try { await GH.saveData(state.data); } catch (e) { closeLoading(); alert('Ошибка: ' + e.message); return; }
        closeLoading(); route();
    }
    async function deleteCharacter(pid, cid) {
        if (!(await checkAdminAccess())) return;
        if (!confirm('Удалить персонажа?')) return;
        showLoading('Удаление...');
        const p = state.data.participants.find(x => x.id === pid);
        if (p && p.characters) {
            const c = p.characters.find(x => x.id === cid);
            if (c) {
                const cPhotos = getPhotos(c);
                for (const url of cPhotos) { try { await GH.deleteFile(extractPath(url)); } catch(e) {} }
            }
            p.characters = p.characters.filter(x => x.id !== cid);
        }
        try { await GH.saveData(state.data); } catch (e) { closeLoading(); alert('Ошибка: ' + e.message); return; }
        closeLoading(); renderParticipant(pid);
    }

    // ИНИЦИАЛИЗАЦИЯ
    async function init() {
        // Загружаем тему
        try {
            const theme = await GH.getTheme();
            if (theme) {
                applyTheme(theme);
            } else {
                applyTheme(DEFAULT_THEME);
            }
        } catch (e) {
            applyTheme(DEFAULT_THEME);
        }
        renderAdminBtn();
        window.addEventListener('hashchange', route);
        route();
    }

    init();
    </script>
</body>
</html>
